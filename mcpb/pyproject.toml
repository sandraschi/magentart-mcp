[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magentart-mcp"
version = "0.2.0"
description = "MCP server for Google Magenta RealTime 2 music generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "sandraschi" }]

dependencies = [
    "fastmcp>=3.2,<4",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.29.0",
    "prefab-ui>=0.14.0",
    "magenta-rt[jax]",
    "jax>=0.4.28; sys_platform == 'win32'",
    "jax[cuda12]>=0.4.28; sys_platform != 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[project.scripts]
magentart-mcp = "magentart_mcp.server:main"

[tool.uv.sources]
magenta-rt = { path = "../external/magenta-realtime", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/magentart_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
